name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q src examples

  container:
    name: Container smoke test (${{ matrix.arch }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_SHA}" \
            --tag basic-ml-api:ci \
            .

      - name: Start container
        run: |
          docker run --detach \
            --name basic-ml-api-ci \
            --publish 127.0.0.1:5000:5000 \
            basic-ml-api:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' basic-ml-api-ci)
            if [ "$status" = "healthy" ]; then
              docker exec basic-ml-api-ci python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs basic-ml-api-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs basic-ml-api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force basic-ml-api-ci || true

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Copy deployment inputs
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".dockerignore,Dockerfile,docker-compose.yml,pyproject.toml,uv.lock,README.md,LICENSE,src"
          target: "~/docker/basic_ml_api"
          overwrite: true

      - name: Rebuild and restart service
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_VERSION: ${{ github.sha }}
          APP_NAME: ${{ vars.APP_NAME }}
          APP_ENV: ${{ vars.APP_ENV }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          LOKI_URL: ${{ secrets.LOKI_URL }}
          HOST_PORT: ${{ vars.HOST_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_VERSION,APP_NAME,APP_ENV,LOG_LEVEL,LOKI_URL,HOST_PORT
          script: |
            set -eu
            cd ~/docker/basic_ml_api

            APP_NAME=${APP_NAME:-basic-ml-api}
            APP_ENV=${APP_ENV:-production}
            LOG_LEVEL=${LOG_LEVEL:-INFO}
            HOST_PORT=${HOST_PORT:-12021}

            umask 077
            {
              printf 'VERSION=%s\n' "$DEPLOY_VERSION"
              printf 'APP_NAME=%s\n' "$APP_NAME"
              printf 'APP_ENV=%s\n' "$APP_ENV"
              printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
              printf 'LOKI_URL=%s\n' "${LOKI_URL:-}"
              printf 'HOST_PORT=%s\n' "$HOST_PORT"
            } > .env
            chmod 600 .env

            docker compose config --quiet
            # Preserve the existing model store when switching to the non-root runtime.
            test ! -L data
            docker compose build basic_ml_api
            docker compose stop basic_ml_api
            if ! docker compose run --rm --no-deps -T --user 0:0 \
              --cap-add CHOWN --cap-add DAC_OVERRIDE --entrypoint sh basic_ml_api \
              -eu -c 'test ! -L /app/data/model_; mkdir -p /app/data/model_; chown -R --no-dereference 10001:10001 /app/data/model_'; then
              docker compose start basic_ml_api || true
              exit 1
            fi
            docker compose up --detach --no-build basic_ml_api

            healthy=0
            for attempt in $(seq 1 45); do
              if docker compose exec -T basic_ml_api python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).close()"; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              docker compose logs --no-color basic_ml_api
              exit 1
            fi
