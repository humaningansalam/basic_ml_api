[project]
name = "basic-ml-api"
version = "0.3.2"
description = "A hardened Flask API for uploading, caching, and serving trusted Keras models."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1.2,<4",
    "gunicorn>=22,<26",
    "his-monitoring",
    "prometheus-client>=0.23.1,<1",
    "tensorflow-cpu==2.16.*",
]

[tool.uv]
package = false

[tool.uv.sources]
his-monitoring = { git = "https://github.com/humaningansalam/his-monitoring.git", rev = "449a45fd2884e58cefc984ff2b15660d042432ca" }

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10",
    "pytest-flask>=1.3.0,<2",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.17.6,<0.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".repometa"]

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "I", "PIE", "PT", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
